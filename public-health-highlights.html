<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公共卫生五件套指挥中心</title>
    <link rel="stylesheet" href="./portal.css" />
    <script src="./auth.js"></script>
    <script>window.HealthCityAuth.requireRole(["commission"])</script>
    <style>
      .highlight-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
      .highlight-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: #fff; min-height: 132px; }
      .highlight-card.active { border-color: var(--blue); box-shadow: inset 0 0 0 1px rgba(39, 110, 241, .18); }
      .highlight-card strong { display: block; font-size: 15px; }
      .highlight-card span { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.55; }
      .highlight-card em { display: inline-block; margin-top: 12px; color: var(--teal); font-size: 12px; font-style: normal; font-weight: 800; }
      .map-board { position: relative; min-height: 360px; overflow: hidden; border: 1px solid #b9d8d7; border-radius: 8px; background: linear-gradient(135deg, #eef8f7, #f7fbfa); }
      .map-board::before, .map-board::after { content: ""; position: absolute; background: rgba(15, 118, 110, .13); }
      .map-board::before { left: 10%; right: 10%; top: 48%; height: 1px; box-shadow: 0 -90px 0 rgba(15,118,110,.1), 0 90px 0 rgba(15,118,110,.1); }
      .map-board::after { top: 8%; bottom: 8%; left: 48%; width: 1px; box-shadow: -180px 0 0 rgba(15,118,110,.08), 180px 0 0 rgba(15,118,110,.08); }
      .map-node { position: absolute; transform: translate(-50%, -50%); z-index: 2; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; background: var(--blue); box-shadow: 0 2px 9px rgba(23, 32, 42, .25); cursor: pointer; }
      .map-node.alert { width: 22px; height: 22px; background: var(--red); }
      .map-node::after { content: attr(data-label); position: absolute; left: 14px; top: 14px; white-space: nowrap; color: var(--ink); font-size: 11px; background: rgba(255,255,255,.92); padding: 3px 5px; border-radius: 4px; border: 1px solid var(--line); }
      .map-label { position: absolute; z-index: 1; color: #4c7775; font-size: 12px; font-weight: 800; }
      .map-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 12px; }
      .legend-dot { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 50%; background: var(--blue); }
      .legend-dot.alert { background: var(--red); }
      .legend-dot.resource { background: var(--green); }
      .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .data-table th, .data-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      .data-table th { color: var(--muted); font-size: 12px; font-weight: 800; }
      .status { display: inline-flex; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 800; background: #edf2f7; color: #475467; }
      .status.high, .status.critical, .status.escalated { color: #a4231b; background: #fde9e7; }
      .status.medium, .status.investigating { color: #8a5600; background: #fff2d8; }
      .status.verified, .status.available, .status.completed, .status.approved { color: #116b4b; background: #e2f5ec; }
      .action-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .action-row button, .compact-form button { border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); padding: 6px 9px; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
      .action-row button:hover, .compact-form button:hover { border-color: var(--blue); color: var(--blue); }
      .insight-list, .task-list, .resource-list { display: grid; gap: 10px; }
      .insight-item, .task-item, .resource-item { border: 1px solid var(--line); border-radius: 8px; padding: 13px; background: #fff; }
      .insight-item header, .task-item header, .resource-item header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
      .insight-item p, .task-item p, .resource-item p { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.55; }
      .compact-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 8px; align-items: end; margin-top: 12px; }
      .compact-form label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
      .compact-form input, .compact-form select { width: 100%; min-height: 34px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
      .empty { color: var(--muted); font-size: 13px; padding: 16px 0; }
      @media (max-width: 980px) { .highlight-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .compact-form { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 640px) { .highlight-grid { grid-template-columns: 1fr 1fr; } .compact-form { grid-template-columns: 1fr; } .map-board { min-height: 300px; } .map-node::after { display: none; } }
    </style>
  </head>
  <body>
    <main class="portal-shell">
      <header class="portal-header">
        <div>
          <span>公共卫生信息化系统</span>
          <h1>五件套指挥中心</h1>
          <p>监测预警、一张图、AI研判、应急调度、证据驾驶舱共用同一条可审计业务链。</p>
        </div>
        <nav>
          <a href="./public-health.html">标准矩阵</a>
          <a href="./health-dashboard.html">综合驾驶舱</a>
          <a href="./index.html">卫健委端</a>
        </nav>
      </header>

      <section class="metric-grid" id="highlight-metrics"></section>
      <p id="highlight-api-error" class="login-error" role="alert"></p>

      <section class="panel" style="margin-bottom:16px">
        <div class="panel-title"><h2>五件套能力状态</h2><span id="highlight-state"></span></div>
        <div id="highlight-capabilities" class="highlight-grid"></div>
      </section>

      <section class="portal-grid">
        <article class="panel wide">
          <div class="panel-title"><h2>公共卫生GIS一张图</h2><span id="map-summary">区域、信号、预警和任务</span></div>
          <div id="highlight-map" class="map-board"></div>
          <div class="map-legend"><span><i class="legend-dot"></i>信号</span><span><i class="legend-dot alert"></i>预警</span><span><i class="legend-dot resource"></i>资源可用</span></div>
        </article>
        <article class="panel">
          <div class="panel-title"><h2>监测信号</h2><span id="signal-quality"></span></div>
          <div id="highlight-signals" class="table-wrap"></div>
          <form id="signal-form" class="compact-form">
            <label>来源<select name="sourceType"><option>公众上报</option><option>临床症候群</option><option>实验室</option><option>药店</option><option>学校/养老</option><option>环境</option></select></label>
            <label>区域<input name="region" value="中山区" required /></label>
            <label>数值<input name="value" type="number" min="0" value="2" required /></label>
            <label>机构<input name="institution" value="人工上报队列" required /></label>
            <button type="submit">接入信号</button>
          </form>
        </article>
      </section>

      <section class="portal-grid">
        <article class="panel wide">
          <div class="panel-title"><h2>多点触发预警队列</h2><span>规则命中、证据引用、人工动作和升级路径</span></div>
          <div id="highlight-alerts" class="table-wrap"></div>
        </article>
        <article class="panel">
          <div class="panel-title"><h2>AI流调研判助手</h2><span id="ai-model-card"></span></div>
          <div id="highlight-ai" class="insight-list"></div>
        </article>
      </section>

      <section class="portal-grid">
        <article class="panel wide">
          <div class="panel-title"><h2>应急指挥与资源调度</h2><span>任务责任人、截止时限、资源占用和回执</span></div>
          <div id="highlight-tasks" class="task-list"></div>
        </article>
        <article class="panel">
          <div class="panel-title"><h2>资源余量</h2><span>可用资源实时摘要</span></div>
          <div id="highlight-resources" class="resource-list"></div>
        </article>
      </section>

      <section class="panel">
        <div class="panel-title"><h2>数据质量与证据链驾驶舱</h2><span id="evidence-summary"></span></div>
        <div id="highlight-evidence" class="table-wrap"></div>
      </section>
    </main>
    <script src="./public-health-highlights.js"></script>
  </body>
</html>
