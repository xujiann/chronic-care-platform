<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公共卫生五件套指挥中心</title>
    <link rel="stylesheet" href="./portal.css" />
    <script src="./access-control-policy.js"></script>
    <script src="./auth.js"></script>
    <script src="./page-auth-bootstrap.js" data-roles="commission"></script>
    <link rel="stylesheet" href="./public-health-highlights-inline.css" />
  </head>
  <body>
    <main class="portal-shell">
      <header class="portal-header">
        <div>
          <span>公共卫生信息化系统</span>
          <h1>五件套指挥中心</h1>
          <p>监测预警、一张图、AI研判、应急调度、证据驾驶舱共用同一条可审计业务链。</p>
        </div>
        <nav>
          <a href="./public-health.html">标准矩阵</a>
          <a href="./health-dashboard.html">综合驾驶舱</a>
          <a href="./index.html">卫健委端</a>
        </nav>
      </header>

      <section class="metric-grid" id="highlight-metrics"></section>
      <p id="highlight-api-error" class="login-error" role="alert"></p>

      <section class="panel csp-margin-bottom-16">
        <div class="panel-title"><h2>五件套能力状态</h2><span id="highlight-state"></span></div>
        <div id="highlight-capabilities" class="highlight-grid"></div>
      </section>

      <section class="portal-grid">
        <article class="panel wide">
          <div class="panel-title"><h2>公共卫生GIS一张图</h2><span id="map-summary">区域、信号、预警和任务</span></div>
          <div id="highlight-map" class="map-board"></div>
          <div class="map-legend"><span><i class="legend-dot"></i>信号</span><span><i class="legend-dot alert"></i>预警</span><span><i class="legend-dot resource"></i>资源可用</span></div>
        </article>
        <article class="panel">
          <div class="panel-title"><h2>监测信号</h2><span id="signal-quality"></span></div>
          <div id="highlight-signals" class="table-wrap"></div>
          <form id="signal-form" class="compact-form">
            <label>来源<select name="sourceType"><option>公众上报</option><option>临床症候群</option><option>实验室</option><option>药店</option><option>学校/养老</option><option>环境</option></select></label>
            <label>区域<input name="region" value="中山区" required /></label>
            <label>数值<input name="value" type="number" min="0" value="2" required /></label>
            <label>机构<input name="institution" value="人工上报队列" required /></label>
            <button type="submit">接入信号</button>
          </form>
        </article>
      </section>

      <section class="portal-grid">
        <article class="panel wide">
          <div class="panel-title"><h2>多点触发预警队列</h2><span>规则命中、证据引用、人工动作和升级路径</span></div>
          <div id="highlight-alerts" class="table-wrap"></div>
        </article>
        <article class="panel">
          <div class="panel-title"><h2>AI流调研判助手</h2><span id="ai-model-card"></span></div>
          <div id="highlight-ai" class="insight-list"></div>
        </article>
      </section>

      <section class="portal-grid">
        <article class="panel wide">
          <div class="panel-title"><h2>应急指挥与资源调度</h2><span>任务责任人、截止时限、资源占用和回执</span></div>
          <div id="highlight-tasks" class="task-list"></div>
        </article>
        <article class="panel">
          <div class="panel-title"><h2>资源余量</h2><span>可用资源实时摘要</span></div>
          <div id="highlight-resources" class="resource-list"></div>
        </article>
      </section>

      <section class="panel">
        <div class="panel-title"><h2>数据质量与证据链驾驶舱</h2><span id="evidence-summary"></span></div>
        <div id="highlight-evidence" class="table-wrap"></div>
      </section>
    </main>
    <script src="./public-health-highlights.js"></script>
  </body>
</html>
