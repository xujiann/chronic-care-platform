components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    StandardVersion:
      name: standardVersion
      in: path
      required: true
      schema:
        type: string
      example: STD-2026-TRIAL
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
      example: SUB-TASK2026001-H000001-V1
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
      example: TASK-2026-001
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: string
      example: MAT-A1-SEED
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
      example: RULE-AUTO-001
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      example: U-NATIONAL-001
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
      example: EXP-APP-001
    ExpertReviewId:
      name: expertReviewId
      in: path
      required: true
      schema:
        type: string
      example: EXP-H000001-B3-SEED
    CycleYear:
      name: cycleYear
      in: path
      required: true
      schema:
        type: integer
      example: 2026
  responses:
    Ok:
      description: 处理成功
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              code:
                type: string
                example: OK
              message:
                type: string
                example: 处理成功
  schemas:
    PublicHealthIncident:
      type: object
      required: [id, revision, laneId, title, level, source, hospitalCode, owner, status, dueAt, latestAction]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        laneId:
          type: string
        title:
          type: string
        level:
          type: string
          enum: [P0, P1, P2]
        source:
          type: string
        hospitalCode:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [待核查, 处置中, 待复核, 已关闭]
        discoveredAt:
          type: string
        dueAt:
          type: string
        lastUpdatedAt:
          type: string
        latestAction:
          type: string
        submittedForReviewBy:
          type: string
        professionalRefs:
          $ref: "#/components/schemas/PublicHealthProfessionalReferences"
        sla:
          $ref: "#/components/schemas/PublicHealthIncidentSla"
        escalation:
          allOf:
            - $ref: "#/components/schemas/PublicHealthIncidentEscalation"
          nullable: true
        professionalAssociation:
          $ref: "#/components/schemas/PublicHealthProfessionalAssociation"
    PublicHealthProfessionalReferences:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
        exchangeTaskId:
          type: string
        exchangeRunId:
          type: string
        evidencePacketId:
          type: string
        probeLaneId:
          type: string
    PublicHealthIncidentSla:
      type: object
      required: [status, overdue, dueSoon, escalationRequired, escalationLevel, escalationRoute]
      properties:
        status:
          type: string
          enum: [overdue, due-soon, within-sla, closed-overdue, closed-within-sla]
        overdue:
          type: boolean
        dueSoon:
          type: boolean
        remainingMinutes:
          type: integer
          nullable: true
        escalationRequired:
          type: boolean
        escalationLevel:
          type: string
          enum: [red, amber, yellow]
        escalationRoute:
          type: string
    PublicHealthIncidentEscalation:
      type: object
      required: [status, level, route, escalatedAt, escalatedBy, note]
      properties:
        status:
          type: string
          enum: [已升级]
        level:
          type: string
          enum: [red, amber, yellow]
        route:
          type: string
        escalatedAt:
          type: string
        escalatedBy:
          type: string
        escalatedByName:
          type: string
        note:
          type: string
    PublicHealthProfessionalAssociation:
      type: object
      required: [references, endpointProbe, integrity]
      properties:
        references:
          $ref: "#/components/schemas/PublicHealthProfessionalReferences"
        event:
          type: object
          nullable: true
        exchange:
          type: object
          nullable: true
        endpointProbe:
          type: object
        evidence:
          type: object
          nullable: true
        integrity:
          type: object
    PublicHealthIncidentCreate:
      type: object
      required: [laneId, title, hospitalCode, owner, dueAt, note]
      additionalProperties: false
      properties:
        id:
          type: string
        laneId:
          type: string
        title:
          type: string
          minLength: 4
        level:
          type: string
          enum: [P0, P1, P2]
        source:
          type: string
        hospitalCode:
          type: string
        owner:
          type: string
        dueAt:
          type: string
        note:
          type: string
          minLength: 4
        professionalRefs:
          $ref: "#/components/schemas/PublicHealthProfessionalReferences"
    PublicHealthIncidentAction:
      type: object
      required: [action, expectedRevision, note]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [start-handling, submit-review, verify-close, escalate-overdue]
        expectedRevision:
          type: integer
