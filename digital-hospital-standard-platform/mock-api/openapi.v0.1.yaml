  /api/digital-hospital/public-health/coordination:
    get:
      tags: [PublicHealthCoordination]
      summary: 获取公共卫生协同工作台
      description: 返回八类业务通道、专业系统只读关联、SLA统计、连续活动、异常事件、动作留痕及始终关闭的生产边界。
      security:
        - bearerAuth: []
      parameters:
        - name: hospitalCode
          in: query
          schema:
            type: string
        - name: laneId
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [P0, P1, P2]
        - name: status
          in: query
          schema:
            type: string
            enum: [待核查, 处置中, 待复核, 已关闭]
        - name: overdueOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: 公共卫生协同工作台
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicHealthCoordinationBoard"
        "401":
          description: 未登录
        "403":
          description: 非卫健委角色
  /api/digital-hospital/public-health/incidents:
    post:
      tags: [PublicHealthCoordination]
      summary: 登记公共卫生协同事件
      description: 仅接收最小化事件元数据，拒绝密钥、令牌、签名、nonce、凭据和原始载荷字段。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicHealthIncidentCreate"
      responses:
        "201":
          description: 事件已登记并写入审计链
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicHealthIncidentMutation"
        "400":
          description: 字段校验失败或包含禁止的敏感字段
        "401":
          description: 未登录
        "403":
          description: 非卫健委角色
        "409":
          description: 事件编号重复
  /api/digital-hospital/public-health/incidents/{incidentId}/actions:
    post:
      tags: [PublicHealthCoordination]
      summary: 推进公共卫生协同事件
      description: 使用乐观修订号执行开始处置、提交复核、独立复核关闭或SLA超时升级；升级不改变原处置状态。
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicHealthIncidentAction"
      responses:
        "200":
          description: 事件已推进并写入审计链
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicHealthIncidentMutation"
        "400":
          description: 字段校验失败
        "401":
          description: 未登录
        "403":
          description: 非卫健委角色
        "404":
          description: 事件不存在
        "409":
          description: 修订冲突、动作不合法或未满足独立复核
  /api/digital-hospital/public-health/incidents/export:
    get:
      tags: [PublicHealthCoordination]
      summary: 批量导出公共卫生协同事件
      description: 按医院、通道、级别、状态和SLA筛选导出最小必要事件及专业系统摘要，不返回密钥、签名、nonce、凭据或原始载荷。
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: hospitalCode
          in: query
          schema:
            type: string
        - name: laneId
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [P0, P1, P2]
        - name: status
          in: query
          schema:
            type: string
            enum: [待核查, 处置中, 待复核, 已关闭]
        - name: overdueOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: JSON或CSV事件清单
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/csv:
              schema:
                type: string
        "400":
          description: 导出格式无效
        "401":
          description: 未登录
        "403":
          description: 非卫健委角色
