openapi: 3.0.3
info:
  title: 数智医院新标准平台 v0.20 接口
  version: 0.20.0
  description: >
    面向数智医院新标准平台的接口契约，覆盖评价任务、试点运营、试点协同、接入联调、持久化任务服务、Worker租约、托管密钥、签名回调、重试死信、投产证据、Go/No-Go、试点评估、评价助手、推广准备、运营监控、公共卫生协同、医院申报、分级审核和运行管理。
servers:
  - url: https://example.local
    description: 示例服务地址，正式环境由部署方案确定
tags:
  - name: Tasks
    description: 评价任务与范围管理
  - name: Standards
    description: 标准与指标
  - name: Submissions
    description: 医院申报
  - name: Evidence
    description: 证据材料与敏感数据审批
  - name: Validations
    description: 数据校验
  - name: Reviews
    description: 省级审核
  - name: ExpertReviews
    description: 专家复核
  - name: Rules
    description: 评分规则与底线项
  - name: Results
    description: 评分结果与整改
  - name: Analytics
    description: 统计分析与风险看板
  - name: Intelligence
    description: 国家抽查、规则沙箱、材料辅助分类与异常识别
  - name: Notifications
    description: 站内信、移动端、短信与邮件提醒
  - name: Imports
    description: 模板批量导入、校验报告与补正重跑
  - name: PilotOperations
    description: 申报批次、材料上传队列、审核负荷和运行日报
  - name: PilotCollaboration
    description: 医院准备度、问题工单、培训答疑、试点版本和反馈闭环
  - name: PilotIntegration
    description: 医院接入申请、源系统连接器、凭据、数据映射、认证测试、问题处置和上线准入
  - name: IntegrationExecution
    description: 持久化执行仓库、保险库引用、Worker mTLS身份、租约、重试死信、签名回执、投产证据和Go/No-Go
  - name: PilotAssessment
    description: 试点成效、问题复盘、优化计划、推广准备和评估报告
  - name: EvaluationAssistant
    description: 标准问答、异常说明、整改建议和审核风险辅助研判
  - name: Monitoring
    description: 服务、接口、任务队列、存储容量和统一告警监控
  - name: PublicHealthCoordination
    description: 公共卫生八通道连续活动、异常事件、独立复核和生产边界
  - name: Operations
    description: 年度运行、规则核验与安全复核
  - name: System
    description: 角色权限、用户、导出审批与审计日志
paths:
  /api/v1/evaluation-tasks:
    get:
      tags: [Tasks]
      summary: 获取评价任务清单
      responses:
        "200":
          description: 评价任务包
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPackage"
    post:
      tags: [Tasks]
      summary: 创建评价任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationTask"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/evaluation-tasks/{taskId}/reminders:send:
    post:
      tags: [Tasks]
      summary: 发送任务催办提醒
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-batches:
    get:
      tags: [PilotOperations]
      summary: 获取试点申报批次
      responses:
        "200":
          description: 试点运营包
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotPackage"
    post:
      tags: [PilotOperations]
      summary: 创建试点申报批次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionBatch"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-batches/{batchId}/publish:
    post:
      tags: [PilotOperations]
      summary: 发布试点申报批次并通知参评机构
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/material-upload-jobs:
    get:
      tags: [PilotOperations]
      summary: 获取材料上传与安全扫描队列
      responses:
        "200":
          description: 材料上传队列
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaterialUploadJob"
    post:
      tags: [PilotOperations]
      summary: 创建材料上传任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUploadJob"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/reviewer-workloads:
    get:
      tags: [PilotOperations]
      summary: 获取审核人员负荷
      responses:
        "200":
          description: 审核负荷
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewerWorkload"
  /api/v1/reviewer-workloads:balance:
    post:
      tags: [PilotOperations]
      summary: 按人员容量和风险等级自动均衡审核任务
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-daily-reports:
    get:
      tags: [PilotOperations]
      summary: 获取试点运行日报
      responses:
        "200":
          description: 运行日报
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotDailyReport"
    post:
      tags: [PilotOperations]
      summary: 生成试点运行日报
      responses:
        "200":
          description: 新生成日报
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/PilotDailyReport"
  /api/v1/pilot-readiness:
    get:
      tags: [PilotCollaboration]
      summary: 获取试点医院准备度
      responses:
        "200":
          description: 医院准备度清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HospitalReadiness"
    post:
      tags: [PilotCollaboration]
      summary: 重新评估全部试点医院准备度
      responses:
        "200":
          description: 试点协同包
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationPackage"
  /api/v1/pilot-readiness/{hospitalCode}/blockers:resolve:
    post:
      tags: [PilotCollaboration]
      summary: 推进医院准备阻塞项
      parameters:
        - name: hospitalCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-tickets:
    get:
      tags: [PilotCollaboration]
      summary: 获取试点问题工单
      responses:
        "200":
          description: 问题工单清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotTicket"
    post:
      tags: [PilotCollaboration]
      summary: 登记试点问题工单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotTicket"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-tickets/{ticketId}:
    put:
      tags: [PilotCollaboration]
      summary: 更新、推进或升级问题工单
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotTicket"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-tickets:assign:
    post:
      tags: [PilotCollaboration]
      summary: 按问题分类自动分派工单
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-training-sessions:
    get:
      tags: [PilotCollaboration]
      summary: 获取试点培训与答疑场次
      responses:
        "200":
          description: 培训场次清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrainingSession"
    post:
      tags: [PilotCollaboration]
      summary: 新建或发布培训场次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSession"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-training-sessions/{sessionId}/attendance:
    post:
      tags: [PilotCollaboration]
      summary: 记录培训签到并更新场次状态
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-releases:
    get:
      tags: [PilotCollaboration]
      summary: 获取试点版本清单
      responses:
        "200":
          description: 试点版本清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotRelease"
    post:
      tags: [PilotCollaboration]
      summary: 创建试点候选版本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotRelease"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-releases/{releaseId}/publish:
    post:
      tags: [PilotCollaboration]
      summary: 发布试点候选版本
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-feedback:
    get:
      tags: [PilotCollaboration]
      summary: 获取试点版本反馈
      responses:
        "200":
          description: 版本反馈清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotFeedback"
    post:
      tags: [PilotCollaboration]
      summary: 收集试点版本反馈
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotFeedback"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-feedback/{feedbackId}:
    get:
      tags: [PilotCollaboration]
      summary: 获取单条试点反馈
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 单条版本反馈
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotFeedback"
    put:
      tags: [PilotCollaboration]
      summary: 更新评估状态并解决试点反馈
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotFeedback"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-access-applications:
    get:
      tags: [PilotIntegration]
      summary: 获取试点医院接入申请
      responses:
        "200":
          description: 接入申请清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotAccessApplication"
    post:
      tags: [PilotIntegration]
      summary: 提交医院接入申请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotAccessApplication"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-access-applications/{applicationId}:
    put:
      tags: [PilotIntegration]
      summary: 受理并推进医院接入申请
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotAccessApplication"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-connectors:
    get:
      tags: [PilotIntegration]
      summary: 获取医院源系统连接器
      responses:
        "200":
          description: 连接器清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotConnector"
    post:
      tags: [PilotIntegration]
      summary: 登记源系统连接器
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotConnector"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-connectors/{connectorId}:probe:
    post:
      tags: [PilotIntegration]
      summary: 执行连接器连通探测
      parameters:
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-connectors/{connectorId}:rotate-credential:
    post:
      tags: [PilotIntegration]
      summary: 轮换连接器接入凭据
      parameters:
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-connectors/{connectorId}:certify:
    post:
      tags: [PilotIntegration]
      summary: 执行OpenAPI接口契约认证
      parameters:
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 认证测试记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotIntegrationTest"
  /api/v1/pilot-data-mappings:
    get:
      tags: [PilotIntegration]
      summary: 获取试点数据映射清单
      responses:
        "200":
          description: 数据映射清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotDataMapping"
    post:
      tags: [PilotIntegration]
      summary: 登记或更新数据映射
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotDataMapping"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-data-mappings/{mappingId}:sample-check:
    post:
      tags: [PilotIntegration]
      summary: 执行字段映射与脱敏抽样
      parameters:
        - name: mappingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 抽样测试记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotIntegrationTest"
  /api/v1/pilot-integration-tests:
    get:
      tags: [PilotIntegration]
      summary: 获取联调认证测试记录
      responses:
        "200":
          description: 联调认证测试记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotIntegrationTest"
  /api/v1/pilot-integration-issues:
    get:
      tags: [PilotIntegration]
      summary: 获取联调问题清单
      responses:
        "200":
          description: 联调问题清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotIntegrationIssue"
    post:
      tags: [PilotIntegration]
      summary: 登记联调问题
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotIntegrationIssue"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-integration-issues/{issueId}:resolve:
    post:
      tags: [PilotIntegration]
      summary: 关闭联调问题并登记处置结论
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/v1/pilot-integration-gates:
    get:
      tags: [PilotIntegration]
      summary: 获取医院上线准入状态
      responses:
        "200":
          description: 上线准入清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PilotIntegrationGate"
  /api/v1/pilot-integration-gates/{hospitalCode}:evaluate:
    post:
      tags: [PilotIntegration]
      summary: 评估医院上线准入门禁
      parameters:
        - name: hospitalCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 最新上线准入状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotIntegrationGate"
  /api/v1/pilot-integration-gates/{hospitalCode}:approve:
    post:
      tags: [PilotIntegration]
      summary: 批准试点医院上线
      parameters:
        - name: hospitalCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/digital-hospital/execution/runtime:
    get:
      tags: [IntegrationExecution]
      summary: 获取持久化任务运行中心
      description: 需要卫生管理角色；返回SQLite事务仓库、队列、Worker、死信、回执和切换证据的脱敏状态。
      responses:
        "200":
          description: 生产任务运行中心
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionExecutionRuntime"
  /api/digital-hospital/execution/security:
    get:
      tags: [IntegrationExecution]
      summary: 获取外部安全适配器状态
      responses:
        "200":
          description: 托管密钥、回调mTLS和Worker服务身份配置状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionExecutionSecurity"
  /api/digital-hospital/execution/workers:
    post:
      tags: [IntegrationExecution]
      summary: 注册或恢复生产Worker
      description: 生产环境仅接受受信mTLS服务身份；开发环境允许卫生管理角色兼容调用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, capabilities]
              properties:
                id:
                  type: string
                node:
                  type: string
                pool:
                  type: string
                capabilities:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          $ref: "#/components/responses/Ok"
  /api/digital-hospital/execution/vault-references:
    post:
      tags: [IntegrationExecution]
      summary: 登记托管保险库引用
      description: 原始vault引用仅在请求事务内用于生成不可逆指纹，不进入运行状态、日志或导出包。
      responses:
        "201":
          $ref: "#/components/responses/Ok"
  /api/digital-hospital/execution/jobs:
    post:
      tags: [IntegrationExecution]
      summary: 持久化创建幂等执行任务
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorId, environmentId, jobType, payload]
              properties:
                connectorId:
                  type: string
                environmentId:
                  type: string
                jobType:
                  type: string
                payload:
                  type: object
                  writeOnly: true
                  additionalProperties: true
                maxAttempts:
                  type: integer
                  minimum: 1
      responses:
        "201":
          $ref: "#/components/responses/Ok"
  /api/digital-hospital/execution/jobs/{jobId}/actions:
    post:
      tags: [IntegrationExecution]
      summary: 原子领取、心跳、完成或失败执行任务
      description: 生产环境仅接受受信Worker mTLS服务身份；原始租约令牌只在领取响应中返回一次。
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
