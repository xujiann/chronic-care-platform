<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>血液业务中心</title><link rel="stylesheet" href="./portal.css"><script src="./auth.js"></script><script>window.HealthCityAuth.requireRole(["commission","institution"])</script><style>
.biz-shell{max-width:1240px;margin:auto;padding:24px}.biz-hero{background:linear-gradient(120deg,#681322,#b42135);color:#fff;border-radius:18px;padding:24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.biz-hero p{color:#ffe6e8}.biz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.biz-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;cursor:pointer}.biz-card.active{border-color:#a51d2d;box-shadow:0 0 0 2px #a51d2d22}.biz-card span,.biz-card small{display:block;color:var(--muted);margin-top:6px}.feature-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.feature-tags i{font-style:normal;font-size:12px;background:#f4f6f8;border-radius:999px;padding:4px 7px}.biz-layout{display:grid;grid-template-columns:.8fr 1.4fr;gap:16px}.biz-form{display:grid;gap:10px}.biz-form label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.biz-form input,.biz-form select,.biz-form textarea{border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}.biz-action{border:0;border-radius:8px;background:#a51d2d;color:#fff;padding:10px 14px;cursor:pointer}.biz-table{width:100%;border-collapse:collapse}.biz-table th,.biz-table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.biz-table th{font-size:12px;color:var(--muted)}.biz-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.biz-metric{border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px}.biz-metric strong{display:block;font-size:26px;margin-top:6px}.toast{position:fixed;right:22px;bottom:22px;background:#17202a;color:#fff;padding:12px 16px;border-radius:9px;display:none}@media(max-width:850px){.biz-grid{grid-template-columns:repeat(2,1fr)}.biz-layout{grid-template-columns:1fr}.biz-metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.biz-grid,.biz-metrics{grid-template-columns:1fr}.biz-hero{display:block}}
</style></head><body><main class="biz-shell"><header class="biz-hero"><div><span>BIS + BTIS</span><h1>血液业务中心</h1><p id="scope-label">正在加载岗位业务范围……</p></div><div><a class="ghost-button link-button" href="./blood.html" style="color:#681322">返回血液系统</a></div></header><div class="biz-metrics" id="biz-metrics"></div><section class="panel"><div class="panel-header"><div><h2>业务域</h2><p>选择业务域查看功能并登记业务记录。</p></div></div><div class="biz-grid" id="biz-domains"></div></section><div class="biz-layout"><section class="panel"><div class="panel-header"><h2 id="form-title">业务登记</h2></div><form class="biz-form" id="biz-form"><div id="biz-fields"></div><button class="biz-action" type="submit">保存业务记录</button></form></section><section class="panel"><div class="panel-header"><h2>业务记录</h2><button class="biz-action" id="reload" type="button">刷新</button></div><div id="biz-records"></div></section></div></main><div class="toast" id="toast"></div><script src="./blood-business.js"></script></body></html>
