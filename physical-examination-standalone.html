<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="健康体检独立模块生产控制面" />
    <title>健康体检独立模块 · 生产控制面</title>
    <link rel="stylesheet" href="./physical-examination-standalone-inline.css" />
  </head>
  <body>
    <main>
      <header>
        <span>模块 ID · physical-examination</span>
        <h1>健康体检独立生产控制面</h1>
        <p class="boundary">只加载体检域文件，不依赖急救、用血或影像模块。真实现场回执、医学文档签名、原件扫描归档、异常闭环、独立签署、冒烟和回退证据任一缺失时，结论固定为 NO-GO。</p>
        <strong class="status" id="standalone-decision">NO-GO</strong>
      </header>

      <section class="csp-margin-top-16">
        <h2>独立模块能力</h2>
        <div class="cards" id="standalone-capabilities"></div>
      </section>

      <div class="grid">
        <section>
          <h2>体检源系统字段映射</h2>
          <p>内置体检中心与医院两个版本化画像，输出统一成人健康体检文档字段和映射回执。</p>
          <div id="standalone-mapping-profiles"></div>
        </section>
        <section>
          <h2>生产证据要求</h2>
          <p>所有证据只记录引用、摘要和回执，不在浏览器持久化患者原始载荷。</p>
          <div id="standalone-evidence-requirements"></div>
        </section>
      </div>

      <div class="grid">
        <section>
          <h2>现场证据包</h2>
          <p>粘贴已脱敏的证据包 JSON 后执行本地校验。页面不会上传或保存内容。</p>
          <textarea id="standalone-bundle" spellcheck="false" aria-label="现场证据包 JSON"></textarea>
          <p><button id="standalone-run" type="button">运行 Go-Live 门禁</button></p>
          <p id="standalone-error" class="error" role="alert"></p>
        </section>
        <section>
          <h2>门禁结果</h2>
          <div class="cards" id="standalone-summary"></div>
          <ul class="checks" id="standalone-checks"></ul>
          <h3>阻断项</h3>
          <ul id="standalone-blockers"></ul>
        </section>
      </div>
    </main>
    <script src="./physical-examination-standards.js"></script>
    <script src="./physical-examination-production.js"></script>
    <script src="./physical-examination-standalone.js"></script>
  </body>
</html>
