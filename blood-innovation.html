<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>血液系统创新指挥中心</title><link rel="stylesheet" href="./portal.css"><script src="./auth.js"></script><script>window.HealthCityAuth.requireRole(["commission","institution"])</script>
<style>:root{--blood:#9f1d2c}.bi-shell{max-width:1500px;margin:auto;padding:22px}.bi-hero{background:linear-gradient(125deg,#65101e,#b9293c);color:#fff;padding:26px;border-radius:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.bi-hero p{color:#ffe5e8}.bi-hero a{color:#65101e;background:#fff;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:700}.bi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.bi-card,.bi-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.bi-card strong{display:block;font-size:25px;margin-top:7px}.bi-capabilities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.bi-capability{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.bi-number{background:#f8dfe3;color:#841624;border-radius:999px;width:30px;height:30px;display:grid;place-items:center;font-weight:800}.bi-ok{color:#087752;font-weight:700}.bi-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px}.bi-table{width:100%;border-collapse:collapse}.bi-table th,.bi-table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.bi-table th{font-size:12px;color:var(--muted)}.bi-actions{display:flex;gap:8px;flex-wrap:wrap}.bi-actions button{border:0;background:var(--blood);color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.bi-actions input{border:1px solid var(--line);border-radius:8px;padding:9px}.bi-status{padding:3px 8px;border-radius:999px;background:#dff3ea;color:#087752;font-size:12px}.bi-status.risk{background:#ffe2df;color:#9a211a}.bi-timeline{border-left:3px solid #d89ca5;padding-left:14px;margin:12px 0}.bi-timeline small{color:var(--muted)}@media(max-width:900px){.bi-grid,.bi-capabilities{grid-template-columns:repeat(2,1fr)}.bi-layout{grid-template-columns:1fr}}@media(max-width:560px){.bi-grid,.bi-capabilities{grid-template-columns:1fr}}</style></head>
<body><main class="bi-shell"><header class="bi-hero"><div><h1>血液系统创新指挥中心</h1><p>13项能力统一运行、统一证据、统一预警，覆盖血液中心与用血机构。</p></div><a href="./blood.html">返回血液系统</a></header><section class="bi-grid" id="summary"></section><section class="bi-panel"><h2>13项亮点能力</h2><div class="bi-capabilities" id="capabilities"></div></section><div class="bi-layout"><section class="bi-panel"><h2>区域库存一张图</h2><div id="inventory"></div></section><section class="bi-panel"><h2>风险信号与应急态势</h2><div id="risks"></div></section></div><div class="bi-layout"><section class="bi-panel"><h2>供需预测与智能调度</h2><div class="bi-actions"><button data-run="supply-forecast">运行7日预测</button><button data-run="donor-recruitment">生成精准招募</button></div><div id="forecast"></div></section><section class="bi-panel"><h2>标准符合性自动检查</h2><div class="bi-actions"><button data-run="compliance-check">立即扫描</button></div><div id="compliance"></div></section></div><div class="bi-layout"><section class="bi-panel"><h2>临床合理用血辅助</h2><div class="bi-actions"><input id="hb" type="number" value="82" aria-label="血红蛋白"><input id="amount" type="number" value="2" aria-label="申请量"><button data-run="rational-use">执行决策支持</button></div><div id="decision"></div></section><section class="bi-panel"><h2>PDA床旁闭环</h2><div class="bi-actions"><input id="patient-code" value="ZY20260711018" aria-label="患者码"><input id="unit-code" value="CN2102-20260711-00182" aria-label="血袋码"><button data-run="pda-bedside">四码核对</button></div><div id="pda"></div></section></div><section class="bi-panel" style="margin-top:14px"><h2>跨模块事件枢纽</h2><p>向院前急救、质量安全、医院运营和综合驾驶舱发布标准化血液事件，并保留投递、死信和订阅投影。</p><div class="bi-actions"><button id="publish-events">发布当前血液态势</button></div><div id="event-hub"></div></section><section class="bi-panel" style="margin-top:14px"><h2>一袋血数字孪生证据链</h2><div class="bi-actions"><input id="trace-code" value="CN2102-20260711-00182" aria-label="血袋码"><button id="trace">追溯</button></div><div id="twin"></div></section></main><script src="./blood-innovation.js"></script></body></html>
