name: Production promotion preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  verify-production-promotion:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: [self-hosted, production-promotion]
    timeout-minutes: 30
    env:
      PRODUCTION_DEPLOYMENT_PACKAGE_FILE: ${{ vars.PRODUCTION_DEPLOYMENT_PACKAGE_FILE }}
      PRODUCTION_RELEASE_REGISTRY_FILE: ${{ vars.PRODUCTION_RELEASE_REGISTRY_FILE }}
      PRODUCTION_CONFIG_ENV_FILE: ${{ vars.PRODUCTION_CONFIG_ENV_FILE }}
      PRODUCTION_RELEASE_EVIDENCE_DIR: ${{ vars.PRODUCTION_RELEASE_EVIDENCE_DIR }}
      PRODUCTION_CUTOVER_ACTION_EVIDENCE_DIR: ${{ vars.PRODUCTION_CUTOVER_ACTION_EVIDENCE_DIR }}
      PRODUCTION_EVIDENCE_TRUST_ANCHORS_FILE: ${{ vars.PRODUCTION_EVIDENCE_TRUST_ANCHORS_FILE }}
      PRODUCTION_EVIDENCE_TRUST_ENVELOPE_FILE: ${{ vars.PRODUCTION_EVIDENCE_TRUST_ENVELOPE_FILE }}
      PRODUCTION_EVIDENCE_TRUST_ANCHORS_SHA256: ${{ secrets.PRODUCTION_EVIDENCE_TRUST_ANCHORS_SHA256 }}
    steps:
      - name: Checkout approved main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up approved Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify immutable deployment package
        run: node scripts/production-deployment-package.js verify --input="$PRODUCTION_DEPLOYMENT_PACKAGE_FILE"
      - name: Run strict production preflight
        run: >-
          npm run production:preflight:strict --
          --package="$PRODUCTION_DEPLOYMENT_PACKAGE_FILE"
          --registry="$PRODUCTION_RELEASE_REGISTRY_FILE"
          --config-env="$PRODUCTION_CONFIG_ENV_FILE"
          --evidence-dir="$PRODUCTION_RELEASE_EVIDENCE_DIR"
          --output="$RUNNER_TEMP/production-preflight-report.json"
          --markdown="$RUNNER_TEMP/production-preflight-report.md"
      - name: Create digest-only promotion receipt
        run: >-
          node scripts/production-promotion-receipt.js
          --report="$RUNNER_TEMP/production-preflight-report.json"
          --output="$RUNNER_TEMP/production-promotion-receipt.json"
      - name: Upload digest-only promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-promotion-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
