name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run blood system readiness gate
        run: npm run blood-system:readiness
      - name: Run emergency collaboration API gate
        run: npm run emergency:test
      - name: Run physical examination innovation and API gate
        run: npm run physical-examination:test
      - name: Run commercial crypto adapter tests
        run: node --test test/commercial-crypto-readiness.test.js
      - name: Run API regression tests
        run: npm run test:coverage
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Run deployment readiness gate
        run: npm run deploy:check
      - name: Inspect storage model
        run: npm run storage:inspect
      - name: Generate identity integration contract
        run: npm run identity:contract
      - name: Generate audit retention report
        run: npm run audit:retention
      - name: Generate chronic follow-up readiness report
        run: npm run chronic:followup-readiness
      - name: Generate chronic informatization source report
        run: npm run chronic:informatization-sources
      - name: Generate data quality report
        run: npm run data-quality:report
      - name: Generate data governance readiness report
        run: npm run data-governance:readiness
      - name: Generate digital hospital standards readiness report
        run: npm run digital-hospital:standards-readiness
      - name: Generate six platform standards ledgers
        run: npm run platform:standards-ledgers
      - name: Generate phase 2 proposal readiness report
        run: npm run phase2:proposal-readiness
      - name: Generate phase 2 catalog readiness report
        run: npm run phase2:catalog-readiness
      - name: Generate phase 2 joint-test readiness report
        run: npm run phase2:joint-test-readiness
      - name: Generate phase 2 mutual recognition readiness report
        run: npm run phase2:mutual-recognition-readiness
      - name: Generate phase 2 disease reporting readiness report
        run: npm run phase2:disease-reporting-readiness
      - name: Generate phase 2 clinical assist readiness report
        run: npm run phase2:clinical-assist-readiness
      - name: Generate phase 2 family doctor readiness report
        run: npm run phase2:family-doctor-readiness
      - name: Generate citizen service operations readiness report
        run: npm run phase2:citizen-operations-readiness
      - name: Generate appointment registration journey readiness report
        run: npm run registration:journey-readiness
      - name: Generate appointment callback integration readiness report
        run: npm run registration:integration-readiness
      - name: Generate commercial crypto adapter readiness report
        run: npm run security:commercial-crypto-readiness
      - name: Generate medical quality and safety report
        run: npm run quality-safety:report
      - name: Generate drug consumable readiness report
        run: npm run drug-consumable:readiness
      - name: Generate integration readiness report
        run: npm run integration:readiness
      - name: Generate interface mapping report
        run: npm run interface:mapping
      - name: Generate regional data sharing report
        run: npm run regional-data-sharing:report
      - name: Generate hybrid deployment readiness report
        run: npm run hybrid:deployment-readiness
      - name: Generate research sandbox readiness report
        run: npm run research:sandbox
      - name: Generate monitoring readiness report
        run: npm run monitoring:readiness
      - name: Generate operations readiness report
        run: npm run operations:readiness
      - name: Generate site readiness pack
        run: npm run site:pack
      - name: Generate priority application templates
        run: npm run priority-apps:templates
      - name: Generate maternal child readiness report
        run: npm run maternal-child:readiness
      - name: Generate physical examination readiness report
        run: npm run physical-examination:readiness
      - name: Generate policy coverage report
        run: npm run policy:coverage
      - name: Generate production database readiness report
        run: npm run production-db:readiness
      - name: Build PostgreSQL migration manifest package
        run: npm run postgres:migration-package
      - name: Verify PostgreSQL migration manifest package
        run: npm run postgres:migration-verify
      - name: Test PostgreSQL transactional outbox and worker contracts
        run: node --test test/postgres-runtime-sync.test.js
      - name: Generate interoperability evaluation evidence
        run: npm run evaluation:evidence
      - name: Generate referral teleconsultation readiness report
        run: npm run referral:readiness
      - name: Generate medical escort readiness report
        run: npm run escort:readiness
      - name: Generate internet nursing readiness report
        run: npm run internet-nursing:readiness
      - name: Generate release artifact manifest
        run: npm run release:manifest
      - name: Generate release readiness report
        run: npm run release:report
      - name: Build immutable production deployment package
        run: npm run deployment:package -- --strict --release-id=${{ github.sha }}
      - name: Verify immutable production deployment package
        run: npm run deployment:verify
      - name: Upload release readiness report
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: release/
          if-no-files-found: error
      - name: Audit production dependencies
        run: npm audit --omit=dev
