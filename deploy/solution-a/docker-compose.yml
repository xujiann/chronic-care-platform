services:
  hapi-fhir:
    image: "${HAPI_FHIR_IMAGE:-hapiproject/hapi:v8.10.0-3@sha256:55213612779ab3eeec919226b7bad378f0061ade823393a61d7dd46dd5087a3d}"
    restart: unless-stopped
    ports: ["127.0.0.1:${HAPI_FHIR_PORT:-8080}:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi-db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD:?set HAPI_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    depends_on: { hapi-db: { condition: service_healthy } }
    networks: [clinical]
  hapi-db:
    image: "${POSTGRES_IMAGE:-postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c}"
    restart: unless-stopped
    environment: { POSTGRES_DB: hapi, POSTGRES_USER: hapi, POSTGRES_PASSWORD: "${HAPI_DB_PASSWORD:?set HAPI_DB_PASSWORD}" }
    volumes: [hapi-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hapi"], interval: 10s, timeout: 5s, retries: 10 }
    networks: [clinical]
  orthanc:
    image: "${ORTHANC_IMAGE:-orthancteam/orthanc:26.8.1@sha256:ffdfa1141b6b89a631c10d5ac612e18b934d601c3501e73b597bd700ecfd4004}"
    restart: unless-stopped
    ports: ["127.0.0.1:${ORTHANC_PORT:-8042}:8042", "${ORTHANC_DICOM_BIND_ADDRESS:-127.0.0.1}:${ORTHANC_DICOM_PORT:-4242}:4242"]
    environment:
      ORTHANC__NAME: solution-a-orthanc
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:?set ORTHANC_USERNAME}":"${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD}"}'
      ORTHANC__AUTHENTICATION_ENABLED: "${ORTHANC_AUTHENTICATION_ENABLED:-true}"
      DICOM_WEB_PLUGIN_ENABLED: "true"
    volumes: [orthanc-db:/var/lib/orthanc/db]
    networks: [clinical]
  ohif:
    image: "${OHIF_IMAGE:-ohif/app:v3.12.11@sha256:157e2b9d89b214950fc9e43ce6f714d0e5fab83cb3e82b84edb97cac892fac7a}"
    restart: unless-stopped
    ports: ["127.0.0.1:${OHIF_PORT:-3000}:80"]
    volumes:
      - ./ohif-app-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./ohif-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [orthanc]
    networks: [clinical]
networks: { clinical: {} }
volumes: { hapi-db: {}, orthanc-db: {} }
